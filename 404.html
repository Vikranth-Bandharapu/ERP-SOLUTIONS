<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Stackly ERP</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',
                        dark: '#0B1120', /* Deep space blue/slate */
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-text {
            background: linear-gradient(90deg, #4338ca 0%, #a855f7 50%, #e11d48 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .bg-gradient-glow {
            background: radial-gradient(circle at center, rgba(30, 58, 138, 0.15) 0%, transparent 60%);
        }
    </style>
</head>
<body class="antialiased bg-dark min-h-screen flex flex-col justify-center items-center relative overflow-hidden font-sans">
    
    <!-- Subtle Background Glows matching the image -->
    <div class="absolute inset-0 z-0 bg-gradient-glow pointer-events-none"></div>
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-[100px] opacity-10 animate-pulse"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-rose-500 rounded-full mix-blend-multiply filter blur-[100px] opacity-10 animate-pulse" style="animation-delay: 2s;"></div>

    <div class="container mx-auto px-4 z-10 text-center relative flex flex-col items-center">
        
        <!-- Big Gradient 404 -->
        <h1 class="text-[10rem] md:text-[14rem] lg:text-[16rem] font-black leading-none tracking-tighter gradient-text mb-4 select-none drop-shadow-lg">
            404
        </h1>
        
        <h2 class="text-3xl md:text-4xl font-bold text-white mb-6 tracking-wide">Page Not Found</h2>
        
        <p class="text-slate-400 mb-10 max-w-md mx-auto text-sm md:text-base leading-relaxed">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track!
        </p>
        
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 w-full max-w-md mx-auto">
            <button onclick="window.history.back()" class="bg-blue-600 hover:bg-blue-500 text-white py-3 px-8 rounded-full font-bold transition-all shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)] flex items-center justify-center gap-2 w-full sm:w-auto">
                <i class="fa-solid fa-arrow-left text-sm"></i> Go Back
            </button>
            <a href="index.html" class="bg-slate-900 border border-slate-700 hover:border-slate-500 hover:bg-slate-800 text-white py-3 px-8 rounded-full font-bold transition-all flex items-center justify-center gap-2 w-full sm:w-auto">
                <i class="fa-solid fa-house text-sm"></i> Back to Home
            </a>
        </div>
        
    </div>

</body>
</html>
